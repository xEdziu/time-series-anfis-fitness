[project]
name = "hrforecast"
version = "0.1.0"
description = "Prognoza tętna w trakcie treningu: LSTM (nauczyciel) vs ANFIS (uruchamiany na Garmin Fenix 8)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "garmin-fit-sdk>=21.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "torch>=2.13",  # GHSA-rrmf-rvhw-rf47 (torch.jit.script) poprawione w 2.13
]

[project.scripts]
hr-prepare = "hrforecast.prepare:main"
hr-train = "hrforecast.train:main"
hr-export = "hrforecast.export_watch:main"
hr-online = "hrforecast.online:main"
hr-report = "hrforecast.report:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hrforecast"]

# RTX 5080 (Blackwell, sm_120) wymaga kół PyTorch zbudowanych z CUDA >= 12.8; torch >= 2.13 wychodzi
# już tylko dla CUDA 13.0 (sterownik NVIDIA >= 580).
# Na laptopie bez NVIDIA te same koła działają na CPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
